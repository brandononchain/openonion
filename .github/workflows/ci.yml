name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,browser]"
      - run: playwright install --with-deps chromium
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Tor sidecar
        run: docker build -t openonion-tor infra/docker/tor
      - name: Build API image
        run: docker build -t openonion-api .
      - name: Tor sidecar starts and binds its listeners
        run: |
          docker run -d --name tor -e TOR_CONTROL_PASSWORD=ci0test0pass openonion-tor
          for i in $(seq 1 30); do
            docker logs tor 2>&1 | grep -q "Opened Control listener" && break
            sleep 1
          done
          docker logs tor 2>&1 | grep "Opened Socks listener" | wc -l | grep -qx 10
