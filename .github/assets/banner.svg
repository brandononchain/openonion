<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="OpenOnion: the liberated AI agent with Tor-isolated browsing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0716"/>
      <stop offset=".55" stop-color="#140B2A"/>
      <stop offset="1" stop-color="#1E0F3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="o1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8B4FE"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="o2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BEF264"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8B4FE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- Tor circuit: you → guard → middle → exit -->
  <g stroke="#A78BFA" stroke-opacity=".45" stroke-width="2" fill="none" stroke-dasharray="6 8">
    <path d="M760 330 L840 250 L930 300 L1010 210"/>
    <path d="M1170 120 L1110 200 L1180 290"/>
  </g>
  <g fill="#C4B5FD">
    <circle cx="760" cy="330" r="5" fill-opacity=".9"/>
    <circle cx="840" cy="250" r="5" fill-opacity=".7"/>
    <circle cx="930" cy="300" r="5" fill-opacity=".7"/>
    <circle cx="1170" cy="120" r="5" fill-opacity=".7"/>
    <circle cx="1180" cy="290" r="5" fill-opacity=".9"/>
  </g>

  <!-- onion mark -->
  <g transform="translate(902 30) scale(1.35)">
    <path d="M128 70 C128 48 118 34 104 24" fill="none" stroke="url(#o2)" stroke-width="8" stroke-linecap="round"/>
    <path d="M128 70 C130 46 144 32 160 28" fill="none" stroke="url(#o2)" stroke-width="8" stroke-linecap="round"/>
    <path d="M128 66 C176 98 214 132 214 170 C214 210 176 236 128 236 C80 236 42 210 42 170 C42 132 80 98 128 66 Z" fill="#140B2A" fill-opacity=".6" stroke="url(#o1)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M128 92 C162 118 188 142 188 172 C188 202 162 220 128 220 C94 220 68 202 68 172 C68 142 94 118 128 92 Z" fill="none" stroke="url(#o1)" stroke-width="7" stroke-linejoin="round" opacity=".8"/>
    <path d="M128 118 C148 136 162 152 162 174 C162 194 148 204 128 204 C108 204 94 194 94 174 C94 152 108 136 128 118 Z" fill="none" stroke="url(#o1)" stroke-width="6" stroke-linejoin="round" opacity=".6"/>
    <circle cx="128" cy="176" r="12" fill="#F3E8FF"/>
    <circle cx="128" cy="176" r="5" fill="#7C3AED"/>
  </g>

  <!-- copy -->
  <g font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="80" y="104" fill="#A78BFA" font-size="20" font-weight="600" letter-spacing="4">OPEN SOURCE · SELF-HOSTED · PROVIDER-AGNOSTIC</text>
    <text x="76" y="200" fill="url(#title)" font-size="104" font-weight="800" letter-spacing="-3">OpenOnion</text>
    <text x="80" y="254" fill="#E9D5FF" font-size="30" font-weight="500">The liberated AI agent with Tor-isolated browsing.</text>
    <text x="80" y="296" fill="#A1A1AA" font-size="21">Transparent think → act → observe loop · every step an auditable event</text>
  </g>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600">
    <rect x="80" y="330" width="150" height="38" rx="19" fill="#7C3AED" fill-opacity=".18" stroke="#A78BFA" stroke-opacity=".5"/>
    <text x="155" y="355" fill="#E9D5FF" text-anchor="middle">tor_browse</text>
    <rect x="244" y="330" width="166" height="38" rx="19" fill="#22C55E" fill-opacity=".14" stroke="#4ADE80" stroke-opacity=".5"/>
    <text x="327" y="355" fill="#BBF7D0" text-anchor="middle">.onion ready</text>
    <rect x="424" y="330" width="212" height="38" rx="19" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".2"/>
    <text x="530" y="355" fill="#E4E4E7" text-anchor="middle">allow · ask · deny</text>
    <rect x="650" y="330" width="80" height="38" rx="19" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".2"/>
    <text x="690" y="355" fill="#E4E4E7" text-anchor="middle">SSE</text>
  </g>
</svg>
