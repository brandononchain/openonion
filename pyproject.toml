[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "openonion"
version = "0.1.0"
description = "A liberated, self-hostable, provider-agnostic AI agent with Tor-isolated browsing."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "OpenOnion contributors" }]
keywords = ["ai-agent", "llm", "tor", "onion", "privacy", "self-hosted", "playwright", "fastapi", "anthropic", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.19",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/brandononchain/openonion"
Documentation = "https://github.com/brandononchain/openonion/tree/main/docs"
Issues = "https://github.com/brandononchain/openonion/issues"
Changelog = "https://github.com/brandononchain/openonion/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
browser = ["playwright>=1.44", "httpx[socks]>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
openonion = "openonion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openonion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
